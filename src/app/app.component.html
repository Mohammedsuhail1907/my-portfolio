<nav class="bg-gray-800 text-white p-4 h-[80px] flex-shrink-0 relative z-50">
  <div class="flex justify-between items-center h-full">
    <div class="text-xl font-bold text-blue-300">Welcome Buddy!!</div>

    <!-- Toggle Button for Mobile -->
    <button class="md:hidden" (click)="toggleMenu()" aria-label="Toggle Menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Desktop Menu -->
    <div class="hidden md:flex gap-6 text-lg">
      <a routerLink="/" routerLinkActive="text-blue-400 font-bold" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/about" routerLinkActive="text-blue-400 font-bold">About</a>
      <a routerLink="/projects" routerLinkActive="text-blue-400 font-bold">Projects</a>
      <a routerLink="/contact" routerLinkActive="text-blue-400 font-bold">Contact</a>
    </div>
  </div>

  <!-- ✅ Mobile Menu -->
  @if (menuOpen()) {
    <div class="absolute top-full left-0 w-full z-50 bg-gray-800 flex flex-col md:hidden gap-4 p-4 text-lg shadow-lg">
      <a routerLink="/" (click)="toggleMenu()" routerLinkActive="text-blue-400 font-bold" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/about" (click)="toggleMenu()" routerLinkActive="text-blue-400 font-bold">About</a>
      <a routerLink="/projects" (click)="toggleMenu()" routerLinkActive="text-blue-400 font-bold">Projects</a>
      <a routerLink="/contact" (click)="toggleMenu()" routerLinkActive="text-blue-400 font-bold">Contact</a>
    </div>
  }
</nav>

<main class="flex-1 overflow-hidden">
  <router-outlet />
</main>
