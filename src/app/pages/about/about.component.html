<section id="about" class="section section--alt" aria-labelledby="about-title">
  <div class="container">
    <app-section-heading eyebrow="About" title="About Me" titleId="about-title" />

    <div class="section__body grid-2">
      <div class="about__intro" appReveal>
        <p class="lead about__lead">{{ intro.lead }}</p>
        @for (paragraph of intro.paragraphs; track paragraph) {
          <p class="about__paragraph">{{ paragraph }}</p>
        }

        <ul class="about__stats" role="list" appReveal revealStagger>
          @for (stat of stats; track stat.label) {
            <li class="reveal-item" [style.--i]="$index">
              <p-card class="about__stat">
                <span class="about__stat-value gradient-text" [appCountUp]="stat.value"></span>
                <span class="about__stat-label">{{ stat.label }}</span>
              </p-card>
            </li>
          }
        </ul>
      </div>

      <div class="about__services" appReveal>
        <h3 class="about__subtitle">What I Do</h3>

        <ul class="stack" role="list" appReveal revealStagger>
          @for (service of services; track service.title) {
            <li class="reveal-item" [style.--i]="$index">
              <p-card class="about__service hover-lift">
                <div class="about__service-body">
                  <span class="icon-tile about__service-icon">
                    <i [class]="service.icon" aria-hidden="true"></i>
                  </span>
                  <div class="about__service-text">
                    <h4 class="about__service-title">{{ service.title }}</h4>
                    <p class="text-muted about__service-desc">{{ service.description }}</p>
                  </div>
                </div>
              </p-card>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
