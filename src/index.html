<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mohammed Suhail — Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title and description here are fallbacks only. Every page's title, description,
       canonical, Open Graph / Twitter tags and JSON-LD are written by SeoService (src/app/seo)
       from the route's `title` + `data.seo`, and baked into the pre-rendered HTML at build time
       (angular.json `outputMode: "static"`). Edit them in app.routes.ts / site.config.ts. -->
  <meta name="description" content="Mohammed Suhail is a full stack developer in Chennai, Tamil Nadu, building responsive, scalable web applications with Angular, TypeScript and .NET.">
  <meta name="author" content="Mohammed Suhail">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/images/portrait.jpg" as="image" fetchpriority="high">

  <!-- Apply the saved/system colour scheme before first paint to avoid a light→dark flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('app-dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#020617');
        }
      } catch (e) { /* storage unavailable — default to light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
