  <!-- ==========================================================================================
       STATIC SEO / SOCIAL HEAD
       ==========================================================================================
       Every tag below is also written at build time by SeoService (src/app/seo) from the route's
       `title` + `data.seo`, and Angular's Meta service updates each one IN PLACE (matched on its
       name/property), so the pre-rendered HTML carries exactly one of each — never a duplicate.

       They are hard-coded here as well so the contract holds even for a response that never runs
       the app: the un-hydrated shell (index.csr.html), a scraper that ignores JavaScript, or a
       build where pre-rendering is turned off.

       The values mirror src/app/config/site.config.ts and src/app/app.routes.ts. Change them
       there first; `npm run build` re-checks that this block still agrees with the rendered
       output and warns on drift (scripts/verify-prerender.mjs).
       ========================================================================================== -->

  <!-- Apply the saved/system colour scheme before first paint to avoid a light→dark flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('app-dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#020617');
        }
      } catch (e) { /* storage unavailable — default to light */ }
    })();
  </script>
